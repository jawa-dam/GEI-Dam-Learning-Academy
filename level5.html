<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEI Academy — Level 5: The Mill</title><style>body{margin:0;background:#061a28;color:#eef;font-family:Arial;padding:18px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between}.card{background:#0d2940;border:1px solid #21506a;border-radius:18px;padding:18px;margin:14px 0}.ey{font-size:12px;letter-spacing:.14em;color:#56d7e8}.mission{display:none}.mission.active{display:block}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#173b55;color:#fff;font-weight:700}.wheel{width:170px;height:170px;border:12px dashed #e8a33d;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:55px;transition:transform .5s}.bar{height:12px;background:#173449;border-radius:10px;overflow:hidden}.fill{height:100%;background:#46d19c;width:0}.reward{display:none;text-align:center;background:#123d35;padding:20px;border-radius:16px}a{color:#7fe8ff}</style></head><body><main><div class="top"><div><div class="ey">LEVEL 5 · THE MILL</div><h1>Turn Water Into Power</h1></div><a href="index.html">← Dashboard</a></div><div class="card"><div class="wheel" id="wheel">⚙️</div><p id="hello"></p><div class="bar"><div class="fill" id="fill"></div></div><p id="stats"></p><p><strong>Mill Power Lab: <span id="power">0%</span></strong></p><button id="powerBtn">💧 Send Water to Wheel</button></div><div id="missions"></div><div class="reward" id="reward"><h2>⚙️ LEVEL 5 COMPLETE</h2><p>The water-powered mill is operational.</p><a href="level6.html">Continue directly to Level 6 →</a></div></main><script>(()=>{const K='gei-academy-state-v1',D={name:'',xp:0,completed:[],level5Tasks:[],millPower:0};const M=[['01 · Water Meets Wheel','What makes the mill useful in the GEI system?',['Moving water supplies usable power','The dam disappears','The wheel stores the reservoir'],0],['02 · Wheel Motion','Tap the power lab to drive the wheel.',['SEND WATER','STOP WATER','RESET'],0],['03 · Mechanical Work','Water power is converted into…',['Mechanical motion','Dry land','Darkness'],0],['04 · Flow → Work','What is the central engineering relationship?',['Controlled flow can perform work','Water cannot do work','Gates create mountains'],0],['05 · Power Target','Reach the release target in the Mill Power Lab.',['75%','25%','0%'],0],['06 · Mill Mastery','What completes this stage?',['A powered water wheel','A closed empty reservoir','A broken gate'],0]];function read(){let s={...D};try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}s.completed=Array.isArray(s.completed)?s.completed:[];s.level5Tasks=Array.isArray(s.level5Tasks)?s.level5Tasks:[];s.millPower=Number(s.millPower||0);return s}function save(s){localStorage.setItem(K,JSON.stringify(s))}let s=read();if(!s.completed.includes(4)){hello.textContent='🔒 Level 5 is locked. Complete Level 4 first.';powerBtn.disabled=true;return}let done=new Set(s.level5Tasks),host=document.getElementById('missions');M.forEach((m,i)=>{let d=document.createElement('section');d.className='card mission'+(i===0?' active':'');d.innerHTML=`<div class=ey>MISSION ${i+1} / 6</div><h2>${m[0]}</h2><p>${m[1]}</p>${m[2].map((x,j)=>`<button data-j=${j}>${x}</button>`).join('')}<p id=f${i}></p><button id=n${i} disabled>${i===5?'Complete Level 5':'Next Mission →'}</button>`;host.appendChild(d);let bs=d.querySelectorAll('[data-j]');bs.forEach(b=>b.onclick=()=>{let good=+b.dataset.j===m[3];if(i===1&&!done.has(i)){s.millPower=Math.min(75,s.millPower+25);save(s)}if(i===4&&s.millPower<75){document.getElementById('f4').textContent='❌ Bring the Mill Power Lab to 75% first.';return}bs.forEach(x=>x.disabled=true);document.getElementById('f'+i).textContent=good?'✅ Correct! +25 XP':'❌ Review the mill concept.';if(good){if(!done.has(i)){done.add(i);s.level5Tasks=[...done];s.xp+=25;save(s)}document.getElementById('n'+i).disabled=false;render()}else setTimeout(()=>bs.forEach(x=>x.disabled=false),400)});document.getElementById('n'+i).onclick=()=>{if(i===5){if(done.size<6||s.millPower<75)return;if(!s.completed.includes(5))s.completed.push(5);s.xp=Math.max(s.xp,750);save(s);render();reward.style.display='block'}else{d.classList.remove('active');host.children[i+1].classList.add('active');scrollTo({top:0,behavior:'smooth'})}}});powerBtn.onclick=()=>{s.millPower=Math.min(75,s.millPower+25);wheel.style.transform=`rotate(${s.millPower*5}deg)`;save(s);render()};function render(){hello.textContent=`Explorer ${s.name} · Water-Powered Mill`;stats.textContent=`XP: ${s.xp} · Missions: ${done.size}/6`;fill.style.width=(done.size/6*100)+'%';power.textContent=s.millPower+'%';if(s.completed.includes(5))reward.style.display='block';if(s.millPower>=75)powerBtn.textContent='✅ Mill Power Target Reached'}render()})();</script></body></html>
