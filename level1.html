<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>GEI Academy — Level 1: Genesis / Light</title><style>body{margin:0;background:#071b2c;color:#eef;font-family:Arial,sans-serif;padding:18px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#0d2940;border:1px solid #21506a;border-radius:18px;padding:18px;margin:14px 0}.ey{font-size:12px;letter-spacing:.14em;color:#56d7e8}.mission{display:none}.mission.active{display:block}.answers button,.actions button{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;background:#173b55;color:white;font-weight:700}.answers button:hover{filter:brightness(1.15)}.ok{outline:2px solid #46d19c}.bad{outline:2px solid #ff6b81}.progress{height:10px;background:#163449;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#46d19c;transition:.3s}.mascot{font-size:42px;text-align:center}.reward{text-align:center;background:#123d35;border-radius:16px;padding:20px;margin-top:15px;display:none}a{color:#7fe8ff;text-decoration:none}</style></head><body><main><div class="top"><div><div class="ey">LEVEL 1 · GENESIS / LIGHT</div><h1>Separate the Waters</h1></div><a href="index.html">← Dashboard</a></div><div class="card"><div class="mascot">🦊</div><p id="hello"></p><div class="progress"><div class="fill" id="fill"></div></div><p id="xp"></p></div><div id="missions"></div><div class="reward" id="reward"><h2>🎉 LEVEL 1 COMPLETE</h2><p>You completed the six Genesis / Light missions.</p><p><strong>+150 XP</strong></p><a href="level2.html">Continue to Level 2 →</a></div></main><script>(()=>{'use strict';const K='gei-academy-state-v1',D={name:'',xp:0,completed:[],avatar:'🦊',theme:'dark',level1Tasks:[],level2Tasks:[],level3Tasks:[],level4Tasks:[],level5Tasks:[],level6Tasks:[]};const M=[['01 · Darkness & Deep','In GEI, what does “darkness” represent?',['Deep water / reservoir','Dry land','The mill'],0],['02 · Face of the Deep','What does the “face of the deep” point toward?',['Reservoir side','Downstream field','Mountain peak'],0],['03 · Let There Be Light','In the GEI interpretation, “Let there be light” represents…',['Water being released','A stone wall forming','A wheel stopping'],0],['04 · God Said','In the engineering reading, “God said” signals…',['Release / command flow','A census','A harvest'],0],['05 · Evening & Morning','What GEI pattern is used for the first day?',['High tide and low tide','Winter and summer','Sunrise and sunset only'],0],['06 · Name the Day','What is being named “Day” in this GEI model?',['Released water','The dam wall','The mill wheel'],0]];function read(){let s={...D};try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}if(!Array.isArray(s.completed))s.completed=[];if(!Array.isArray(s.level1Tasks))s.level1Tasks=[];return s}function save(s){localStorage.setItem(K,JSON.stringify(s))}let s=read();if(!s.name){document.getElementById('hello').textContent='Save your Explorer ID on the dashboard before beginning Level 1.';document.getElementById('xp').textContent='Level locked until your profile is created.';return}let done=new Set(s.level1Tasks),host=document.getElementById('missions');M.forEach((m,i)=>{let d=document.createElement('section');d.className='card mission'+(i===0?' active':'');d.id='m'+i;d.innerHTML=`<div class="ey">MISSION ${i+1} / 6</div><h2>${m[0]}</h2><p>${m[1]}</p><div class="answers">${m[2].map((x,j)=>`<button data-j="${j}">${x}</button>`).join('')}</div><p id="fb${i}"></p><div class="actions"><button id="n${i}" disabled>${i===5?'Complete Level 1':'Next Mission →'}</button></div>`;host.appendChild(d);let bs=d.querySelectorAll('button[data-j]');bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.disabled=true);let good=+b.dataset.j===m[3];b.classList.add(good?'ok':'bad');document.getElementById('fb'+i).textContent=good?'✅ Correct!':'❌ Not quite — review the GEI model and try the next mission.';if(good){if(!done.has(i)){done.add(i);s.xp+=25;s.level1Tasks=[...done];save(s)}document.getElementById('n'+i).disabled=false;render()}else{setTimeout(()=>{bs.forEach(x=>{x.disabled=false;x.classList.remove('bad')})},500)}});document.getElementById('n'+i).onclick=()=>{if(i===5){if(done.size<6)return;if(!s.completed.includes(1))s.completed.push(1);s.xp=Math.max(s.xp,150);save(s);render();document.getElementById('reward').style.display='block';return}document.getElementById('m'+i).classList.remove('active');document.getElementById('m'+(i+1)).classList.add('active');scrollTo({top:0,behavior:'smooth'})}});function render(){document.getElementById('hello').textContent=`Explorer ${s.name} · Day 1 foundation`;document.getElementById('xp').textContent=`XP: ${s.xp} · Missions complete: ${done.size}/6`;document.getElementById('fill').style.width=(done.size/6*100)+'%';if(s.completed.includes(1)){document.getElementById('reward').style.display='block'}}render()})();</script></body></html>
