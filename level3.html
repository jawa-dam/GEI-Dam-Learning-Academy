<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEI Academy — Level 3: Reservoir</title><style>body{margin:0;background:#061a28;color:#eef;font-family:Arial;padding:18px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px}.card{background:#0d2940;border:1px solid #21506a;border-radius:18px;padding:18px;margin:14px 0}.ey{font-size:12px;letter-spacing:.14em;color:#56d7e8}.mission{display:none}.mission.active{display:block}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#173b55;color:#fff;font-weight:700}.bar{height:10px;background:#173449;border-radius:10px;overflow:hidden}.fill{height:100%;background:#46d19c;width:0}.hero{text-align:center;font-size:42px}.reward{display:none;text-align:center;background:#123d35;padding:20px;border-radius:16px}a{color:#7fe8ff}</style></head><body><main><div class="top"><div><div class="ey">LEVEL 3 · RESERVOIR</div><h1>Shape the Reservoir</h1></div><a href="index.html">← Dashboard</a></div><div class="card"><div class="hero">💧</div><p id="hello"></p><div class="bar"><div class="fill" id="fill"></div></div><p id="stats"></p></div><div id="missions"></div><div class="reward" id="reward"><h2>🎉 LEVEL 3 COMPLETE</h2><p>Reservoir and dry-land separation complete.</p><a href="level4.html">Continue to Level 4 →</a></div></main><script>(()=>{const K='gei-academy-state-v1',D={name:'',xp:0,completed:[],level3Tasks:[]};const M=[['01 · Reservoir','What is the reservoir?',['Stored upstream water','The mill floor','Dry ground'],0],['02 · Dry Land','In GEI, “dry land” represents…',['The downstream dry side','Deep reservoir water','The spillway alone'],0],['03 · Separation','What makes a reservoir useful?',['Containment and controlled release','Uncontrolled flooding','Removing the dam'],0],['04 · Capacity','What changes when the reservoir fills?',['Available stored water rises','Pressure becomes zero','The wall disappears'],0],['05 · Boundary','Why is the boundary between water and land important?',['It defines controlled zones','It stops gravity','It creates a mountain'],0],['06 · Ready for Flow','What comes next after a stable reservoir?',['Controlled operations','Destroy the wall','Abandon the system'],0]];function read(){let s={...D};try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}s.completed=Array.isArray(s.completed)?s.completed:[];s.level3Tasks=Array.isArray(s.level3Tasks)?s.level3Tasks:[];return s}function save(s){localStorage.setItem(K,JSON.stringify(s))}let s=read();if(!s.completed.includes(2)){hello.textContent='🔒 Level 3 is locked. Complete Level 2 first.';return}let done=new Set(s.level3Tasks),host=document.getElementById('missions');M.forEach((m,i)=>{let d=document.createElement('section');d.className='card mission'+(i===0?' active':'');d.innerHTML=`<div class=ey>MISSION ${i+1} / 6</div><h2>${m[0]}</h2><p>${m[1]}</p>${m[2].map((x,j)=>`<button data-j=${j}>${x}</button>`).join('')}<p id=f${i}></p><button id=n${i} disabled>${i===5?'Complete Level 3':'Next Mission →'}</button>`;host.appendChild(d);let bs=d.querySelectorAll('[data-j]');bs.forEach(b=>b.onclick=()=>{let good=+b.dataset.j===m[3];bs.forEach(x=>x.disabled=true);document.getElementById('f'+i).textContent=good?'✅ Correct! +25 XP':'❌ Review the reservoir concept.';if(good){if(!done.has(i)){done.add(i);s.level3Tasks=[...done];s.xp+=25;save(s)}document.getElementById('n'+i).disabled=false;render()}else setTimeout(()=>bs.forEach(x=>x.disabled=false),400)});document.getElementById('n'+i).onclick=()=>{if(i===5){if(done.size<6)return;if(!s.completed.includes(3))s.completed.push(3);s.xp=Math.max(s.xp,450);save(s);render();reward.style.display='block'}else{d.classList.remove('active');host.children[i+1].classList.add('active');scrollTo({top:0,behavior:'smooth'})}}});function render(){hello.textContent=`Explorer ${s.name} · Reservoir`;stats.textContent=`XP: ${s.xp} · Missions: ${done.size}/6`;fill.style.width=(done.size/6*100)+'%';if(s.completed.includes(3))reward.style.display='block'}render()})();</script></body></html>
