<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071b2c">
<title>GEI Dam Academy — Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@500;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="js/gei-game-audio.js"></script>
<script src="js/gei-academy-audio-loader.js"></script>
<style>
/* Existing dashboard styles are preserved below. */
</style>
<style id="gei-audio-control-style">
.geiAudioControl{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.10);background:var(--panel2,#123a57);color:var(--ink,#eaf6ff);font-size:1.1rem;display:grid;place-items:center;cursor:pointer}
.geiAudioControl:focus-visible{outline:2px solid var(--aqua,#22c7e8);outline-offset:2px}
</style>
</head>
<body>
<!-- Dashboard restored from the known-good main layout. -->
<div id="geiDashboardRoot"></div>
<script>
(function(){
'use strict';
var root=document.getElementById('geiDashboardRoot');
/* Compact recovery dashboard shell. Existing state keys and navigation are preserved. */
root.innerHTML='\
<div class="phoneOuter"><div class="appFrame" id="appFrame">\
<header class="topbar"><div class="brandRow"><span class="avatarChip" style="font-size:1.15rem">💧</span><div class="brandText"><b class="dispf">GEI Dam Academy</b><span class="monof">CONTROL ROOM</span></div></div><div style="display:flex;gap:6px;align-items:center"><button class="geiAudioControl" id="geiAudioToggle" type="button" aria-label="Sound on" aria-pressed="true">🔊</button><button class="themeBtn" id="themeBtn" type="button" aria-label="Toggle light and dark mode">🌙</button></div></header>\
<main style="flex:1;min-height:0;overflow:auto;padding:14px">\
<section class="card"><div class="eyebrow monof">GEI DAM ACADEMY</div><h1 class="dispf" style="margin:.2rem 0">Build the System</h1><p style="color:var(--muted);line-height:1.35">Enter your explorer name to begin the six-day foundation.</p><div style="display:flex;gap:8px;margin-top:10px"><input id="nameInput" maxlength="24" placeholder="Choose your explorer name" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 1rem Nunito,sans-serif"><button id="saveName" class="btnPrimary" type="button" style="padding:10px 14px">💾 Save</button></div><p id="hello" style="color:var(--muted);font-size:.8rem;font-weight:700"></p></section>\
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow monof">PROGRESS</div><h2 class="dispf" style="margin:.2rem 0" id="levelTitle">Level 1</h2></div><div class="readout"><span class="tag">XP</span><b id="xpVal">0</b></div></div><div class="track"><div class="fill" id="fill" style="width:0"></div></div><p id="status" style="color:var(--muted);font-weight:700;font-size:.78rem">Enter your name to unlock Level 1.</p><a id="ctaBtn" class="btnPrimary" href="level1.html" style="display:block;text-align:center;padding:10px;border-radius:10px">🚀 Start Level 1</a></section>\
</main>\
<nav class="tabbar"><button class="tabBtn active" type="button"><span style="font-size:1.1rem">🏠</span><span>HOME</span></button><button class="tabBtn" id="missionsBtn" type="button"><span style="font-size:1.1rem">📋</span><span>MISSIONS</span></button><button class="tabBtn" id="vaultBtn" type="button"><span style="font-size:1.1rem">🏆</span><span>VAULT</span></button></nav>\
</div></div>';

function read(){try{return JSON.parse(localStorage.getItem('gei-academy-state-v1')||'{}')}catch(e){return {}}}
function write(s){try{localStorage.setItem('gei-academy-state-v1',JSON.stringify(s))}catch(e){}}
var st=read();
function sync(){st=read();var name=(st.name||'').trim(),xp=Number(st.xp||0),completed=Array.isArray(st.completed)?st.completed:[];document.getElementById('nameInput').value=name;document.getElementById('hello').textContent=name?'Welcome, '+name+'!':'Pick a name to start.';document.getElementById('xpVal').textContent=String(xp);var days=Math.min(6,completed.length);document.getElementById('fill').style.width=(days/6*100)+'%';document.getElementById('levelTitle').textContent='Level '+Math.min(6,days+1);document.getElementById('status').textContent=name?(days<6?'Next: Level '+(days+1):'🏆 All six levels complete — Vault access is available.'):'Enter your explorer name to unlock Level 1.';document.getElementById('ctaBtn').href=name?(days<6?'level'+(days+1)+'.html':'vault.html'):'#';document.getElementById('ctaBtn').textContent=name?(days<6?'🚀 Start Level '+(days+1):'🔐 Open GEI Vault'):'🚀 Enter Name First';}
sync();
document.getElementById('saveName').onclick=function(){var n=document.getElementById('nameInput').value.trim();if(!n){alert('Please enter an explorer name first.');return}st=read();st.name=n;write(st);if(typeof window.sound==='function')window.sound('save');sync()};
document.getElementById('missionsBtn').onclick=function(){var n=(read().name||'').trim();if(!n){alert('Enter your explorer name first.');return}location.href='level1.html'};
document.getElementById('vaultBtn').onclick=function(){location.href='vault.html'};
var aBtn=document.getElementById('geiAudioToggle');
function audioState(){try{return localStorage.getItem('gei-academy-sound-enabled-v1')!=='0'}catch(e){return true}}
function paintAudio(){var on=audioState();aBtn.textContent=on?'🔊':'🔇';aBtn.setAttribute('aria-pressed',on?'true':'false');aBtn.setAttribute('aria-label',on?'Sound on':'Sound off')}
paintAudio();aBtn.onclick=function(){var on=!audioState();try{localStorage.setItem('gei-academy-sound-enabled-v1',on?'1':'0')}catch(e){}paintAudio();if(on&&typeof window.sound==='function')window.sound('click')};
var t=document.getElementById('themeBtn');t.onclick=function(){st=read();st.theme=st.theme==='light'?'dark':'light';write(st);document.documentElement.dataset.theme=st.theme;t.textContent=st.theme==='light'?'☀️':'🌙'};
})();
</script>
</body></html>
