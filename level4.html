<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEI Academy — Level 4: Operations</title><style>body{margin:0;background:#061a28;color:#eef;font-family:Arial;padding:18px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between}.card{background:#0d2940;border:1px solid #21506a;border-radius:18px;padding:18px;margin:14px 0}.ey{font-size:12px;letter-spacing:.14em;color:#56d7e8}.mission{display:none}.mission.active{display:block}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#173b55;color:#fff;font-weight:700}.gate{font-size:50px;text-align:center}.bar{height:10px;background:#173449;border-radius:10px;overflow:hidden}.fill{height:100%;background:#46d19c;width:0}.reward{display:none;text-align:center;background:#123d35;padding:20px;border-radius:16px}a{color:#7fe8ff}</style></head><body><main><div class="top"><div><div class="ey">LEVEL 4 · OPERATIONS</div><h1>Operate the Gates</h1></div><a href="index.html">← Dashboard</a></div><div class="card"><div class="gate">🚪</div><p id="hello"></p><div class="bar"><div class="fill" id="fill"></div></div><p id="stats"></p></div><div id="missions"></div><div class="reward" id="reward"><h2>⚙️ LEVEL 4 COMPLETE</h2><p>Gate operation and controlled release are complete.</p><a href="level5.html">Continue to Level 5 →</a></div></main><script>(()=>{const K='gei-academy-state-v1',D={name:'',xp:0,completed:[],level4Tasks:[],gateOpen:false};const M=[['01 · Release','What is the purpose of an operating gate?',['Control when water is released','Break the reservoir','Remove all pressure instantly'],0],['02 · Open Gate','Perform the first required gate action. Tap OPEN.',['OPEN','CLOSE','RESET'],0],['03 · Close Gate','After releasing water, what action restores control?',['CLOSE','OPEN','IGNORE'],0],['04 · Flow Control','Why should a gate be operated deliberately?',['To control flow and pressure','To make water vanish','To stop all gravity'],0],['05 · Safe Sequence','Which sequence demonstrates controlled operation?',['OPEN → observe → CLOSE','CLOSE → destroy → OPEN','OPEN forever'],0],['06 · Operator Ready','What is the core lesson of Level 4?',['Water must be managed, not merely released','Water cannot be controlled','Gates have no role'],0]];function read(){let s={...D};try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}s.completed=Array.isArray(s.completed)?s.completed:[];s.level4Tasks=Array.isArray(s.level4Tasks)?s.level4Tasks:[];return s}function save(s){localStorage.setItem(K,JSON.stringify(s))}let s=read();if(!s.completed.includes(3)){hello.textContent='🔒 Level 4 is locked. Complete Level 3 first.';return}let done=new Set(s.level4Tasks),host=document.getElementById('missions');M.forEach((m,i)=>{let d=document.createElement('section');d.className='card mission'+(i===0?' active':'');let extra=i===1?'<button id="open">OPEN GATE</button><button id="close">CLOSE GATE</button>':'';d.innerHTML=`<div class=ey>MISSION ${i+1} / 6</div><h2>${m[0]}</h2><p>${m[1]}</p>${extra}${m[2].map((x,j)=>`<button data-j=${j}>${x}</button>`).join('')}<p id=f${i}></p><button id=n${i} disabled>${i===5?'Complete Level 4':'Next Mission →'}</button>`;host.appendChild(d);let mark=()=>{if(!done.has(i)){done.add(i);s.level4Tasks=[...done];s.xp+=25;save(s)}document.getElementById('n'+i).disabled=false;render()};if(i===1){let a=d.querySelector('#open'),c=d.querySelector('#close');a.onclick=()=>{s.gateOpen=true;save(s);document.getElementById('f1').textContent='✅ Gate OPEN. Now CLOSE it.'};c.onclick=()=>{if(!s.gateOpen){document.getElementById('f1').textContent='❌ Open the gate first.';return}s.gateOpen=false;document.getElementById('f1').textContent='✅ OPEN → CLOSE complete! +25 XP';mark()}}else{let bs=d.querySelectorAll('[data-j]');bs.forEach(b=>b.onclick=()=>{let good=+b.dataset.j===m[3];bs.forEach(x=>x.disabled=true);document.getElementById('f'+i).textContent=good?'✅ Correct! +25 XP':'❌ Review the operations concept.';if(good)mark();else setTimeout(()=>bs.forEach(x=>x.disabled=false),400)})}document.getElementById('n'+i).onclick=()=>{if(i===5){if(done.size<6)return;if(!s.completed.includes(4))s.completed.push(4);s.xp=Math.max(s.xp,600);save(s);render();reward.style.display='block'}else{d.classList.remove('active');host.children[i+1].classList.add('active');scrollTo({top:0,behavior:'smooth'})}}});function render(){hello.textContent=`Explorer ${s.name} · Gate Operations`;stats.textContent=`XP: ${s.xp} · Missions: ${done.size}/6`;fill.style.width=(done.size/6*100)+'%';if(s.completed.includes(4))reward.style.display='block'}render()})();</script></body></html>
