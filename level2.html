<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>GEI Academy — Level 2: Dam / Firmament</title><style>body{margin:0;background:#071b2c;color:#eef;font-family:Arial,sans-serif;padding:18px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#0d2940;border:1px solid #21506a;border-radius:18px;padding:18px;margin:14px 0}.ey{font-size:12px;letter-spacing:.14em;color:#56d7e8}.mission{display:none}.mission.active{display:block}.answers button,.next{width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;background:#173b55;color:white;font-weight:700}.progress{height:10px;background:#163449;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#46d19c;transition:.3s}.mascot{text-align:center;font-size:42px}.reward{display:none;text-align:center;background:#123d35;padding:20px;border-radius:16px}a{color:#7fe8ff}</style></head><body><main><div class="top"><div><div class="ey">LEVEL 2 · DAM / FIRMAMENT</div><h1>Build the Firmament</h1></div><a href="index.html">← Dashboard</a></div><div class="card"><div class="mascot">🛡️</div><p id="hello"></p><div class="progress"><div class="fill" id="fill"></div></div><p id="stats"></p></div><div id="missions"></div><div class="reward" id="reward"><h2>🎉 LEVEL 2 COMPLETE</h2><p>The firmament/dam foundation is complete.</p><a href="level3.html">Continue to Level 3 →</a></div></main><script>(()=>{'use strict';const K='gei-academy-state-v1',D={name:'',xp:0,completed:[],avatar:'🦊',level2Tasks:[]};const M=[['01 · Firmament','In the GEI model, the firmament is best represented by…',['A dam / retaining structure','A fish','A field'],0],['02 · Holding Water','What is the engineering job of the dam?',['Hold and control water','Create darkness only','Turn the mill directly'],0],['03 · Upstream','The water held behind the dam is conceptually…',['Upstream / reservoir water','Downstream dry land','The gate handle'],0],['04 · Wall','What does a dam wall create?',['A separation between sides','A new mountain','A new animal'],0],['05 · Pressure','As water rises against a barrier, what increases?',['Hydraulic pressure','Gravity disappears','The wall becomes water'],0],['06 · Foundation','What should a builder verify before moving on?',['A stable water-control barrier','A broken gate','An empty reservoir'],0]];function read(){let s={...D};try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}s.completed=Array.isArray(s.completed)?s.completed:[];s.level2Tasks=Array.isArray(s.level2Tasks)?s.level2Tasks:[];return s}function save(s){localStorage.setItem(K,JSON.stringify(s))}let s=read();if(!s.completed.includes(1)){document.getElementById('hello').textContent='🔒 Level 2 is locked. Complete Level 1 first.';document.getElementById('stats').textContent='Return to the dashboard.';return}let done=new Set(s.level2Tasks),host=document.getElementById('missions');M.forEach((m,i)=>{let d=document.createElement('section');d.className='card mission'+(i===0?' active':'');d.innerHTML=`<div class="ey">MISSION ${i+1} / 6</div><h2>${m[0]}</h2><p>${m[1]}</p><div>${m[2].map((x,j)=>`<button data-j="${j}">${x}</button>`).join('')}</div><p id="f${i}"></p><button class="next" id="n${i}" disabled>${i===5?'Complete Level 2':'Next Mission →'}</button>`;host.appendChild(d);let bs=d.querySelectorAll('button[data-j]');bs.forEach(b=>b.onclick=()=>{let good=+b.dataset.j===m[3];bs.forEach(x=>x.disabled=true);document.getElementById('f'+i).textContent=good?'✅ Correct! +25 XP':'❌ Review the dam concept.';if(good){if(!done.has(i)){done.add(i);s.level2Tasks=[...done];s.xp+=25;save(s)}document.getElementById('n'+i).disabled=false;render()}else setTimeout(()=>bs.forEach(x=>x.disabled=false),450)});document.getElementById('n'+i).onclick=()=>{if(i===5){if(done.size<6)return;if(!s.completed.includes(2))s.completed.push(2);s.xp=Math.max(s.xp,300);save(s);render();document.getElementById('reward').style.display='block'}else{d.classList.remove('active');document.querySelector('#missions .mission:nth-child('+(i+2)+')').classList.add('active');scrollTo({top:0,behavior:'smooth'})}}});function render(){document.getElementById('hello').textContent=`Explorer ${s.name} · Dam / Firmament`;document.getElementById('stats').textContent=`XP: ${s.xp} · Missions: ${done.size}/6`;document.getElementById('fill').style.width=(done.size/6*100)+'%';if(s.completed.includes(2))document.getElementById('reward').style.display='block'}render()})();</script></body></html>
