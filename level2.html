<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEI Dam Learning Academy — Level 2</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#edf5f8;color:#172533}
main{max-width:760px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #bfd5df;border-radius:24px;padding:28px;margin-top:20px;box-shadow:0 12px 30px rgba(25,55,70,.1)}
h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1;margin:8px 0}
p{font-size:1.08rem;line-height:1.65;color:#52697b}
button,a{display:inline-flex;padding:14px 18px;border-radius:15px;border:0;background:linear-gradient(100deg,#3554e8,#087d91);color:#fff;font-weight:900;text-decoration:none;cursor:pointer}
.xp{font-size:2rem;font-weight:1000;color:#ff9f1c;min-height:45px}
</style>
</head>
<body><main>
<div class="card">
<div>🎓 GEI Dam Learning Academy</div>
<h1>Level 2 — Dam / Firmament</h1>
<p>Integration shell for the v13 progression test. Replace this shell with the existing working Level 2 lesson after link validation.</p>
<div>Player: <strong id="player">Explorer</strong></div>
<div>XP: <strong id="xp">0</strong></div>
<p class="xp" id="burst"></p>
<button id="complete">🏆 Complete Level 2 (+150 XP)</button>
<p><a href="index.html">🏠 Return to Academy Home</a></p>
</div>
</main>
<script>
const KEY="gei-academy-v13-state";
function read(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
const s=read(); document.getElementById("player").textContent=s.name||"Explorer"; document.getElementById("xp").textContent=Number(s.xp)||0;
document.getElementById("complete").addEventListener("click",()=>{
 const x=read(); x.completed=Array.isArray(x.completed)?x.completed:[]; x.xp=Number(x.xp)||0;
 if(!x.completed.includes(2))x.completed.push(2); x.xp+=150; localStorage.setItem(KEY,JSON.stringify(x));
 document.getElementById("xp").textContent=x.xp; document.getElementById("burst").textContent="+150 XP 🎉";
 setTimeout(()=>{location.href="index.html"},650);
});
</script>
</body></html>
