<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEI Academy — Level 6: The System</title><style>body{margin:0;background:#061722;color:#eef;font-family:Arial;padding:14px}main{max-width:800px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.ey{font-size:12px;letter-spacing:.14em;color:#56d7e8}.card{background:#0b2839;border:1px solid #205369;border-radius:18px;padding:16px;margin:12px 0}.mission{display:none}.mission.active{display:block}.system{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}.node{padding:14px;border-radius:14px;background:#173b55;text-align:center;font-weight:700}.arrow{text-align:center;font-size:22px}.control button,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:#17415c;color:#fff;font-weight:700}.status{padding:10px;border-radius:10px;background:#0d354a}.bar{height:10px;background:#143447;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#46d19c;transition:.3s}.reward{display:none;text-align:center;padding:26px;border-radius:18px;background:linear-gradient(135deg,#164b48,#472d52)}a{color:#82e8ff}</style></head><body><main><div class="top"><div><div class="ey">LEVEL 6 · THE SYSTEM</div><h1>Connect the Complete GEI System</h1></div><a href="index.html">← Dashboard</a></div><div class="card"><div class="system"><div class="node">⛰️ SOURCE</div><div class="arrow">→</div><div class="node">💧 RESERVOIR</div><div class="node">🚪 GATE</div><div class="arrow">→</div><div class="node">⚙️ MILL</div></div><p id="hello"></p><div class="bar"><div class="fill" id="fill"></div></div><p id="stats"></p></div><div id="missions"></div><div class="reward" id="reward"><h2>🏆 MASTER BUILDER</h2><p>The complete GEI source → reservoir → gate → mill system is connected.</p><p><strong>900 XP · SIX-DAY FOUNDATION MASTERED</strong></p><a href="index.html">Return to Academy Dashboard →</a></div></main><script>(()=>{const K='gei-academy-state-v1',D={name:'',xp:0,completed:[],level6Tasks:[],sourceOn:false,reservoirReady:false,systemGate:false,millLinked:false};const M=[['01 · Source','Activate the source that feeds the system.',['SOURCE ON','SOURCE OFF','DRAIN'],0],['02 · Reservoir','What must happen between source and gate?',['Water is stored in the reservoir','The mill is removed','The dam opens permanently'],0],['03 · Gate Link','Connect the gate to controlled flow.',['OPEN CONTROL','BREAK GATE','IGNORE FLOW'],0],['04 · Mill Link','Where should controlled water travel to perform work?',['The mill wheel','Dry land only','The mountain'],0],['05 · Complete Circuit','What is the complete GEI sequence?',['SOURCE → RESERVOIR → GATE → MILL','MILL → SOURCE → LAND','GATE → MOUNTAIN → DARKNESS'],0],['06 · System Mastery','What is the key principle of the complete system?',['Each stage transforms or controls water for the next stage','All water must be uncontrolled','The stages are unrelated'],0]];function read(){let s={...D};try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}s.completed=Array.isArray(s.completed)?s.completed:[];s.level6Tasks=Array.isArray(s.level6Tasks)?s.level6Tasks:[];return s}function save(s){localStorage.setItem(K,JSON.stringify(s))}let s=read();if(!s.completed.includes(5)){hello.textContent='🔒 Level 6 is locked. Complete Level 5 first.';return}let done=new Set(s.level6Tasks),host=document.getElementById('missions');M.forEach((m,i)=>{let d=document.createElement('section');d.className='card mission'+(i===0?' active':'');d.innerHTML=`<div class=ey>MISSION ${i+1} / 6</div><h2>${m[0]}</h2><p>${m[1]}</p>${i===0?'<div class=control><button id=source>⛰️ ACTIVATE SOURCE</button></div>':''}${m[2].map((x,j)=>`<button data-j=${j}>${x}</button>`).join('')}<p class=status id=f${i}></p><button id=n${i} disabled>${i===5?'Complete Level 6':'Next Mission →'}</button>`;host.appendChild(d);let mark=()=>{if(!done.has(i)){done.add(i);s.level6Tasks=[...done];s.xp+=25;save(s)}document.getElementById('n'+i).disabled=false;render()};if(i===0){d.querySelector('#source').onclick=()=>{s.sourceOn=true;save(s);document.getElementById('f0').textContent='✅ Source active. +25 XP';mark()}}else{let bs=d.querySelectorAll('[data-j]');bs.forEach(b=>b.onclick=()=>{let good=+b.dataset.j===m[3];if(i===1&&good)s.reservoirReady=true;if(i===2&&good)s.systemGate=true;if(i===3&&good)s.millLinked=true;if(i===4&&good&&!(s.sourceOn&&s.reservoirReady&&s.systemGate&&s.millLinked)){document.getElementById('f4').textContent='❌ Connect all previous system stages first.';return}bs.forEach(x=>x.disabled=true);document.getElementById('f'+i).textContent=good?'✅ Correct! +25 XP':'❌ Review the system flow.';if(good){mark()}else setTimeout(()=>bs.forEach(x=>x.disabled=false),450)})}document.getElementById('n'+i).onclick=()=>{if(i===5){if(done.size<6)return;if(!s.completed.includes(6))s.completed.push(6);s.xp=Math.max(s.xp,900);save(s);render();reward.style.display='block';celebrate()}else{d.classList.remove('active');host.children[i+1].classList.add('active');scrollTo({top:0,behavior:'smooth'})}}});function render(){hello.textContent=`Explorer ${s.name} · Complete GEI System`;stats.textContent=`XP: ${s.xp} · Missions: ${done.size}/6`;fill.style.width=(done.size/6*100)+'%';if(s.completed.includes(6))reward.style.display='block'}function celebrate(){document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:800});for(let i=0;i<70;i++){let p=document.createElement('span');p.textContent=['🎉','⭐','💧','⚙️'][i%4];p.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-20px;font-size:${12+Math.random()*20}px;z-index:99;animation:drop ${2+Math.random()*2}s linear forwards`;document.body.appendChild(p);setTimeout(()=>p.remove(),4500)}}render()})();</script><style>@keyframes drop{to{transform:translateY(110vh) rotate(540deg);opacity:0}}</style></body></html>
